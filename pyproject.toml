[project]
name = "open-system-one"
version = "0.1.0"
description = "Build your own System One model with Mellea: a Jev-compatible decision API over any chat LLM."
readme = "README.md"
requires-python = ">=3.11"   # Mellea 0.8 requires 3.11+
dependencies = [
    "mellea==0.8.0",          # pinned; the API shifts between 0.x releases
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "jinja2",
]

[project.scripts]
open-system-one = "open_system_one.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "typesafe-sdk==0.7.1",          # official SDK: contract tests + Jev baseline client (MIT)
    "datamodel-code-generator",     # generates schema models from the TypeSafe OpenAPI snapshot
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_system_one"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The Claude Code sandbox denies even stat() on .env files; keep collection away from them.
addopts = "--ignore=.env --ignore=.env.example"
markers = ["live: calls a real backend (needs .env); skipped unless OSO_LIVE=1"]
